<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Matematik Tarihi · Giriş</title>
<link rel="stylesheet" href="vendor/inter/index.css">
<link rel="stylesheet" href="vendor/fraunces/index.css">
<link rel="stylesheet" href="vendor/fraunces/wght-italic.css">
<style>
:root{
  --bg:#0D1020; --bg2:#151A30; --ink:#F4EEE3; --mute:#8F96B2; --dim:#555C7A;
  --acc:#FF6B3D; --gold:#FFC24B; --teal:#38D6C4; --sky:#6FA8FF; --rose:#FF5C8A;
  --card:rgba(255,255,255,.045); --line:rgba(255,255,255,.12);
  --serif:'Fraunces Variable',Georgia,serif; --sans:'Inter Variable',system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:#05060c;height:100%;overflow:hidden;color:var(--ink);font-family:var(--sans)}
#wrap{position:absolute;inset:0 0 64px 0;display:flex;align-items:center;justify-content:center}
#stage{position:relative;width:1920px;height:1080px;overflow:hidden;background:var(--bg);flex:none;transform-origin:center center}
body.render #wrap{inset:0;display:block}
body.render #stage{transform:none!important}
body.render #ctrl{display:none}

/* arka plan */
#bg{position:absolute;inset:0;overflow:hidden}
.blob{position:absolute;width:1400px;height:1400px;border-radius:50%}
#blob1{left:-500px;top:-600px;background:radial-gradient(closest-side,rgba(255,107,61,.16),rgba(255,107,61,0))}
#blob2{right:-600px;bottom:-700px;background:radial-gradient(closest-side,rgba(56,120,255,.16),rgba(56,120,255,0))}
#grain{position:absolute;inset:0;opacity:.07;mix-blend-mode:overlay;background-size:256px 256px}

/* sabit çerçeve */
#brand{position:absolute;left:120px;top:52px;font:600 17px var(--sans);letter-spacing:.32em;text-transform:uppercase;color:var(--mute);z-index:20}
#brand b{color:var(--acc);font-weight:700}
#sceneNo{position:absolute;right:120px;top:52px;font:500 17px var(--sans);letter-spacing:.14em;color:var(--mute);z-index:20;text-align:right}
#sceneNo b{color:var(--ink);font-weight:700}
#progress{position:absolute;left:0;bottom:0;height:5px;width:100%;background:linear-gradient(90deg,var(--acc),var(--gold));transform-origin:0 50%;z-index:20}

.scene{position:absolute;inset:0;opacity:0;visibility:hidden}
.full{position:absolute;inset:0;width:1920px;height:1080px}
.head{position:absolute;left:120px;top:118px;z-index:5}
.eyebrow{font:650 21px var(--sans);letter-spacing:.3em;text-transform:uppercase;color:var(--acc)}
.h1{font:500 74px/1.05 var(--serif);margin-top:14px;letter-spacing:-.01em}
.card{background:var(--card);border:1px solid var(--line);border-radius:28px}
.pill{display:inline-flex;align-items:center;gap:12px;padding:14px 28px;border-radius:999px;border:1px solid var(--line);background:var(--card);font:600 30px var(--sans)}

/* 1 giriş */
.floaters span{position:absolute;font-family:var(--serif);color:var(--ink);line-height:1}
.intro{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.mega{font:600 170px/1 var(--serif);letter-spacing:-.025em;perspective:800px}
.mega .ch{display:inline-block}
.intro-sub{font:italic 300 100px/1 var(--serif);color:var(--acc);margin-top:6px}
.rule{width:220px;height:3px;background:var(--acc);margin:46px 0 50px}
.chips{display:flex;gap:24px}
.chip{padding:18px 32px;border:1px solid var(--line);border-radius:999px;background:var(--card);font:500 29px var(--sans)}
.chip b{color:var(--acc);margin-right:14px;font-weight:750}

/* 2 kaynaklar */
.books{position:absolute;left:0;right:0;top:330px;display:flex;justify-content:center;gap:46px}
.book{position:relative;width:270px;height:400px;border-radius:10px 18px 18px 10px;background:var(--c);
  background-image:linear-gradient(135deg,rgba(255,255,255,.16),rgba(255,255,255,0) 45%,rgba(0,0,0,.28));
  box-shadow:0 30px 60px rgba(0,0,0,.45);padding:34px 26px 28px 44px;display:flex;flex-direction:column}
.spine{position:absolute;left:0;top:0;bottom:0;width:18px;background:rgba(0,0,0,.25);border-radius:10px 0 0 10px}
.b-author{font:650 17px var(--sans);letter-spacing:.18em;text-transform:uppercase;opacity:.9}
.b-init{font:600 150px/1 var(--serif);margin:26px 0 auto;opacity:.95}
.b-title{font:italic 400 28px/1.15 var(--serif)}
.tr{position:absolute;left:50%;bottom:-74px;white-space:nowrap;padding:9px 18px;border-radius:999px;background:rgba(56,214,196,.12);color:var(--teal);font:650 19px var(--sans);letter-spacing:.04em;border:1px solid rgba(56,214,196,.45)}
.src-cap{position:absolute;left:0;right:0;top:880px;text-align:center;font:italic 400 40px var(--serif);color:var(--gold)}

/* 3 yol haritası */
.rm-base{fill:none;stroke:rgba(255,255,255,.1);stroke-width:6;stroke-linecap:round}
.rm-prog{fill:none;stroke:url(#rmGrad);stroke-width:6;stroke-linecap:round}
.rm-dot{fill:#fff;filter:drop-shadow(0 0 14px var(--gold))}
.rm-node circle{fill:var(--bg2);stroke:rgba(255,255,255,.25);stroke-width:3}
.rm-node text{font:700 24px var(--sans);fill:var(--mute);text-anchor:middle;dominant-baseline:central}
.rm-label{position:absolute;width:330px;text-align:center}
.rm-label .t{font:600 30px/1.15 var(--sans)}
.rm-label .s{font:500 21px var(--sans);color:var(--mute);margin-top:6px;letter-spacing:.02em}

/* 4 harita */
.m-sphere{fill:#10152B;stroke:rgba(255,255,255,.08);stroke-width:1;vector-effect:non-scaling-stroke}
.m-grat{fill:none;stroke:rgba(255,255,255,.05);stroke-width:1;vector-effect:non-scaling-stroke}
.m-land{fill:#232A4D;stroke:#3A4372;stroke-width:.8;vector-effect:non-scaling-stroke}
.m-mark{position:absolute;left:0;top:0;width:0;height:0}
.m-in{position:absolute;left:0;top:0}
.m-dot{position:absolute;left:-11px;top:-11px;width:22px;height:22px;border-radius:50%;background:var(--c);box-shadow:0 0 0 6px rgba(255,255,255,.12),0 0 30px var(--c)}
.m-ring{position:absolute;left:-11px;top:-11px;width:22px;height:22px;border-radius:50%;border:3px solid var(--c)}
.m-lab{position:absolute;left:26px;top:-34px;white-space:nowrap;padding:10px 18px;border-radius:14px;background:rgba(13,16,32,.82);border:1px solid var(--line);border-left:4px solid var(--c)}
.m-lab.l{left:auto;right:26px;border-left:1px solid var(--line);border-right:4px solid var(--c)}
.m-lab.u{left:-40px;top:-104px}
.m-lab.d{left:-30px;top:26px}
.m-lab .t{font:650 30px var(--sans)}
.m-lab .s{font:500 19px var(--sans);color:var(--mute);margin-top:2px}
.m-region{position:absolute;left:0;top:0;font:600 22px var(--sans);letter-spacing:.32em;text-transform:uppercase;color:rgba(244,238,227,.45);white-space:nowrap}
.map-shade{position:absolute;left:0;top:0;width:1920px;height:330px;background:linear-gradient(180deg,rgba(13,16,32,.95),rgba(13,16,32,0))}

/* 5 köken */
.question{position:absolute;left:0;right:0;top:430px;text-align:center}
.question .q{font:500 104px/1.05 var(--serif)}
.question .q em{color:var(--acc);font-style:italic}
.question .s{font:500 40px var(--sans);color:var(--mute);margin-top:34px}
.quote{position:absolute;left:200px;right:180px;top:340px}
.quote .qm{position:absolute;left:-70px;top:-40px;font:600 180px/1 var(--serif);color:var(--acc);opacity:.9}
.quote p{font:italic 380 54px/1.3 var(--serif)}
.quote .w{display:inline-block}
.quote .key{position:relative;color:var(--gold);font-weight:600}
.quote .ul{position:absolute;left:0;right:0;bottom:2px;height:5px;background:var(--gold);transform-origin:0 50%;border-radius:3px}
.quote .by{font:600 26px var(--sans);letter-spacing:.2em;color:var(--mute);margin-top:22px;text-transform:uppercase}
.trio{position:absolute;left:0;right:0;top:680px;display:flex;justify-content:center;gap:56px}
.trio .card{width:470px;height:300px;padding:26px 34px;display:flex;align-items:center;gap:28px}
.trio svg{width:170px;height:150px;flex:none}
.trio .t{font:600 52px var(--serif)}
.trio .s{font:500 26px var(--sans);color:var(--mute);margin-top:6px}

/* 6 gruplar */
.panels{position:absolute;left:140px;top:290px;display:flex;gap:40px}
.panel{width:520px;height:500px;position:relative;overflow:hidden}
.panel svg{position:absolute;left:0;top:0;width:520px;height:390px}
.panel .cap{position:absolute;left:0;right:0;bottom:30px;text-align:center;font:600 38px var(--serif)}
.panel .cap .arr,.panel .cap .b{color:var(--acc)}
.badge{position:absolute;padding:10px 22px;border-radius:999px;background:var(--acc);color:#1a0f08;font:750 26px var(--sans);letter-spacing:.06em;text-transform:uppercase}
.chain{position:absolute;left:0;right:0;top:850px;display:flex;justify-content:center;align-items:center;gap:26px}
.chain .arr{font:500 44px var(--sans);color:var(--acc)}

/* 7 bir iki çok */
.otm{position:absolute;left:120px;right:120px;top:290px;display:flex;justify-content:space-between}
.otm .col{width:520px;text-align:center}
.otm .word{font:600 150px/1 var(--serif)}
.otm .col:nth-child(3) .word{color:var(--acc);font-style:italic}
.otm svg{width:520px;height:300px;margin-top:20px}
.nope{position:absolute;left:0;right:0;top:880px;display:flex;justify-content:center;gap:120px;align-items:center}
.nope .grp{display:flex;align-items:center;gap:26px;font:500 30px var(--sans);color:var(--mute)}
.nope .num{position:relative;font:600 70px var(--serif);color:var(--dim);width:60px;text-align:center}
.nope .strike{position:absolute;left:-6px;right:-6px;top:50%;height:5px;background:var(--rose);transform-origin:0 50%;border-radius:3px}
.zero{width:96px;height:96px;border-radius:50%;border:3px dashed var(--dim);display:flex;align-items:center;justify-content:center;font:600 60px var(--serif);color:var(--mute)}

/* 8 çetele */
.year{position:absolute;right:120px;top:120px;text-align:right}
.year .l{font:650 21px var(--sans);letter-spacing:.3em;color:var(--mute)}
.year .v{font:600 120px/1 var(--serif);color:var(--gold);margin-top:8px;font-variant-numeric:tabular-nums}
.bone-cap{position:absolute;left:0;right:0;top:790px;text-align:center;font:italic 400 40px var(--serif);color:var(--ink)}
.cave{position:absolute;inset:0;background-size:cover}
.cave-cap{position:absolute;right:160px;top:860px;font:650 24px var(--sans);letter-spacing:.24em;text-transform:uppercase;color:#E9B48A}

/* 9 çoban */
.illus{position:absolute;left:120px;top:290px;width:1100px;height:620px;border-radius:28px;overflow:hidden;box-shadow:0 30px 80px rgba(0,0,0,.4)}
.illus svg{width:1100px;height:620px;display:block}
.tpanel{position:absolute;left:1270px;top:290px;width:530px;height:620px;padding:0}
.tpanel svg{width:530px;height:620px}
.tlab{font:650 22px var(--sans);letter-spacing:.24em;text-transform:uppercase}
.final-cap{position:absolute;left:0;right:0;top:950px;text-align:center;font:italic 400 38px var(--serif)}
.final-cap b{color:var(--gold);font-weight:600}

/* 10 parmaklar */
.seg{fill:#262C4A;stroke:#46507E;stroke-width:2}
.palm{fill:#1F2440;stroke:#3A4370;stroke-width:2}
.counter{position:absolute;left:660px;width:600px;top:300px;text-align:center;font:600 230px/1 var(--serif);font-variant-numeric:tabular-nums}
.formula{position:absolute;left:560px;width:800px;top:610px;text-align:center}
.formula .f{font:600 76px var(--serif);white-space:nowrap}
.formula .f i{color:var(--acc);font-style:normal}
.formula .n{font:650 24px var(--sans);letter-spacing:.28em;text-transform:uppercase;color:var(--teal);margin-top:16px}
.formula .x{font:500 30px var(--sans);color:var(--mute);margin-top:22px}
.hlab{position:absolute;top:1030px;font:650 20px var(--sans);letter-spacing:.28em;text-transform:uppercase;color:var(--mute);text-align:center;width:400px}

/* 11 varsayımlar */
.hyp{position:absolute;left:120px;right:120px;top:290px;display:flex;gap:60px}
.hyp .card{flex:1;height:640px;padding:0;overflow:hidden;position:relative}
.hyp svg{width:100%;height:330px;display:block}
.hyp .body{padding:10px 48px}
.hyp .tag{font:700 20px var(--sans);letter-spacing:.3em;text-transform:uppercase;color:var(--acc)}
.hyp .t{font:600 60px/1.1 var(--serif);margin-top:10px}
.hyp .s{font:450 29px/1.4 var(--sans);color:#C9CDE0;margin-top:16px}

/* 12 belgeler */
.stmt{position:absolute;left:200px;right:200px;top:250px;text-align:center}
.stmt p{font:500 66px/1.2 var(--serif)}
.stmt p .w{display:inline-block}
.stmt p em{color:var(--gold);font-style:italic}
.stmt .s{font:500 32px var(--sans);color:var(--mute);margin-top:26px}
.docs{position:absolute;left:0;right:0;top:500px;height:440px}
.docs svg{position:absolute;left:0;top:0;width:1920px;height:440px}
.dlab{position:absolute;top:400px;width:520px;text-align:center;font:650 24px var(--sans);letter-spacing:.22em;text-transform:uppercase;color:var(--mute)}
.dlab b{color:var(--ink)}
.outro{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.outro .big{font:600 150px/1 var(--serif);margin-top:18px;letter-spacing:-.02em}
.outro svg{width:900px;height:220px;margin-top:40px}
.outro .bye{font:italic 400 64px var(--serif);color:var(--acc);margin-top:30px}

/* önizleme kontrolleri */
#ctrl{position:fixed;left:0;right:0;bottom:0;height:64px;display:flex;align-items:center;gap:16px;padding:0 20px;background:#0b0d18;border-top:1px solid #222;font:500 14px var(--sans);color:#aab}
#ctrl button{background:#FF6B3D;color:#111;border:0;border-radius:8px;padding:8px 16px;font:700 14px var(--sans);cursor:pointer;min-width:84px}
#ctrl input{flex:1;accent-color:#FF6B3D}
#ctrl #tm{font-variant-numeric:tabular-nums;min-width:120px;text-align:right}
</style>
</head>

  <div id="bg"><div class="blob" id="blob1"></div><div class="blob" id="blob2"></div><div id="grain"></div></div>

</div></div>

<script>
'use strict';
const RENDER = new URLSearchParams(location.search).has('render');
if (RENDER) document.body.classList.add('render');

const LEAD = 1.0, TAIL = 1.0;
const SC = window.SCENES;
let T = 0; SC.forEach(s => { s.start = T; T += s.dur; });
const TOTAL = T;
const HOOKS = [], MISSING = [];

/* ---------- yardımcılar ---------- */
const $ = (q, r = document) => r.querySelector(q), $$ = (q, r = document) => [...r.querySelectorAll(q)];
const NS = 'http://www.w3.org/2000/svg';
function h(tag, attrs = {}, html) { const e = document.createElement(tag); for (const k in attrs) e.setAttribute(k, attrs[k]); if (html != null) e.innerHTML = html; return e; }
function s(tag, attrs = {}, parent) { const e = document.createElementNS(NS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); if (parent) parent.appendChild(e); return e; }
function rng(seed) { return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function head(sec, eyebrow, title) { const d = h('div', { class: 'head' }, `<div class="eyebrow">${eyebrow}</div><div class="h1">${title}</div>`); sec.appendChild(d); return d; }
function headIn(tl, d, at = 0.25) {
  tl.from(d.children[0], { y: 20, opacity: 0, duration: .6, ease: 'power3.out' }, at)
    .from(d.children[1], { y: 40, opacity: 0, duration: .8, ease: 'power3.out' }, at + .12);
}
function draw(el) { const L = el.getTotalLength(); el.style.strokeDasharray = L + ' ' + L; el.style.strokeDashoffset = L; return L; }
function useEl(parent, id, x, y, w, hgt) { const u = s('use', { href: '#' + id, x, y, width: w, height: hgt }, parent); return u; }
function fmt(n) { return Math.round(n).toLocaleString('tr-TR'); }
function splitChars(el) {
  const words = el.textContent.split(' ');
  el.innerHTML = words.map(w => `<span style="display:inline-block;white-space:nowrap">${[...w].map(c => `<span class="ch">${c}</span>`).join('')}</span>`).join(' ');
  return $$('.ch', el);
}
/* Anlatım metnindeki bir ifadenin sahne içindeki zamanı (sn). Noktalama duraklamaları ağırlıklandırılır. */
function mkCue(sc) {
  const t = sc.text, w = [0]; let acc = 0;
  for (let i = 0; i < t.length; i++) { const c = t[i]; acc += 1 + ('.!?'.includes(c) ? 9 : (',;:'.includes(c) ? 4 : 0)); w.push(acc); }
  const speech = sc.speech ?? (sc.dur - LEAD - TAIL);
  const at = i => LEAD + w[Math.max(0, Math.min(i, t.length))] / acc * speech;
  const cue = (phrase, off = 0, nth = 1) => {
    let i = -1; for (let k = 0; k < nth; k++) { i = t.indexOf(phrase, i + 1); if (i < 0) break; }
    if (i < 0) { MISSING.push(sc.id + ': ' + phrase); i = 0; }
    return at(i) + off;
  };
  cue.at = at; cue.idx = (phrase, from = 0) => t.indexOf(phrase, from);
  cue.end = LEAD + speech;
  return cue;
}

/* ---------- sahneler ---------- */
const BUILD = {};

BUILD.intro = (sec, cue, sc) => {
  const tl = gsap.timeline();

  const base = s('path', { d, class: 'rm-base' }, svg);

  const L = prog.getTotalLength(), row = xs[4] - xs[0], Lc = L - 2 * row;
  const pos = items.map((_, i) => i < 5 ? { x: xs[i], y: y1, l: xs[i] - xs[0] } : { x: xs[9 - i], y: y2, l: row + Lc + (xs[4] - xs[9 - i]) });

  HOOKS.push(() => {

  const tF = cue('On iki kere', -.2);
  tl.from($('.x', fB), { opacity: 0, y: 14, duration: .5 }, tF)
    .to(counter, { color: '#FFC24B', duration: .4 }, tF + 1)
    .fromTo(counter, { scale: 1 }, { scale: 1.12, duration: .35, yoyo: true, repeat: 1, ease: 'power2.out', immediateRender: false }, tF + 1);
  return tl;
};

BUILD.hypotheses = (sec, cue, sc) => {
  const tl = gsap.timeline();
  const hd = head(sec, 'Matematik neden doğdu?', 'İki varsayım'); headIn(tl, hd);
  const w = h('div', { class: 'hyp' }, `
    <div class="card"><svg viewBox="0 0 810 330"></svg><div class="body"><div class="tag">Varsayım 1</div><div class="t">Pratik ihtiyaçlar</div><div class="s">Matematik, günlük hayattaki pratik gereksinimlere çözüm bulmak amacıyla ortaya çıktı.</div></div></div>
    <div class="card"><svg viewBox="0 0 810 330"></svg><div class="body"><div class="tag">Varsayım 2</div><div class="t">Dini törenler</div><div class="s">Antropolojik çalışmalara göre sayma sanatı, ilkel dini törenlerle ilişkili olarak doğdu.</div></div></div>`);
  sec.appendChild(w);
  const C = $$('.card', w), S = $$('svg', w);
  // kart 1 çizimi
  const s1 = S[0];
  s('rect', { x: 0, y: 260, width: 810, height: 70, fill: 'rgba(47,181,127,.14)' }, s1);
  const it1 = [useEl(s1, 'sheep', 90, 150, 150, 120), useEl(s1, 'sheep', 220, 170, 130, 104)];
  const wheat = s('g', {}, s1);
  for (let i = 0; i < 5; i++) {
    const x = 420 + i * 28;
    s('path', { d: `M${x} 270 Q${x + 6} 200 ${x + 2} 130`, stroke: '#D9B45A', 'stroke-width': 5, fill: 'none' }, wheat);
    for (let k = 0; k < 4; k++) { s('ellipse', { cx: x - 6, cy: 140 + k * 16, rx: 6, ry: 11, fill: '#E8C46A', transform: `rotate(-25 ${x - 6} ${140 + k * 16})` }, wheat); s('ellipse', { cx: x + 10, cy: 140 + k * 16, rx: 6, ry: 11, fill: '#E8C46A', transform: `rotate(25 ${x + 10} ${140 + k * 16})` }, wheat); }
  }
  const tg = s('g', {}, s1);
  [0, 1, 2, 3].forEach(i => s('line', { x1: 610 + i * 26, y1: 140, x2: 610 + i * 26, y2: 230, stroke: '#FFC24B', 'stroke-width': 9, 'stroke-linecap': 'round' }, tg));
  s('line', { x1: 596, y1: 210, x2: 702, y2: 160, stroke: '#FFC24B', 'stroke-width': 9, 'stroke-linecap': 'round' }, tg);
  // kart 2 çizimi
  const s2 = S[1], cx = 405, cy = 165;
  [130, 100, 70].forEach((r, i) => s('circle', { cx, cy, r, fill: 'none', stroke: `rgba(255,194,75,${.18 + i * .1})`, 'stroke-width': 2 }, s2));
  const star = s('path', { d: (() => { let d = ''; for (let i = 0; i < 7; i++) { const a = -Math.PI / 2 + i * 3 * 2 * Math.PI / 7; d += (i ? 'L' : 'M') + (cx + 95 * Math.cos(a)).toFixed(1) + ' ' + (cy + 95 * Math.sin(a)).toFixed(1); } return d + 'Z'; })(), fill: 'none', stroke: '#FFC24B', 'stroke-width': 3 }, s2);
  const dots = [...Array(12)].map((_, i) => { const a = i / 12 * 2 * Math.PI; return s('circle', { cx: cx + 130 * Math.cos(a), cy: cy + 130 * Math.sin(a), r: 8, fill: '#555C7A' }, s2); });
  const flame = s('path', { d: `M${cx} ${cy - 40} C${cx + 30} ${cy - 5} ${cx + 26} ${cy + 34} ${cx} ${cy + 36} C${cx - 26} ${cy + 34} ${cx - 30} ${cy - 5} ${cx} ${cy - 40} Z`, fill: '#FF6B3D' }, s2);
  const flame2 = s('path', { d: `M${cx} ${cy - 8} C${cx + 14} ${cy + 10} ${cx + 12} ${cy + 30} ${cx} ${cy + 31} C${cx - 12} ${cy + 30} ${cx - 14} ${cy + 10} ${cx} ${cy - 8} Z`, fill: '#FFC24B' }, s2);
  // akış
  const t0 = cue('iki temel', -.3), t1 = cue('Birincisine', -.2), t2 = cue('İkincisine', -.2);
  tl.fromTo(C, { opacity: 0, y: 60 }, { opacity: .35, y: 0, duration: .8, stagger: .2, ease: 'power3.out' }, t0);
  tl.to(C[0], { opacity: 1, borderColor: 'rgba(255,107,61,.6)', duration: .6 }, t1)
    .from(it1, { scale: 0, transformOrigin: '50% 100%', duration: .5, stagger: .2, ease: 'back.out(2)' }, t1 + .3)
    .from(wheat.children, { scaleY: 0, transformOrigin: '50% 100%', duration: .4, stagger: .02 }, t1 + .8)
    .from(tg.children, { opacity: 0, y: -20, duration: .3, stagger: .15 }, t1 + 1.4);
  tl.to(C[0], { opacity: .7, borderColor: 'rgba(255,255,255,.12)', duration: .6 }, t2)
    .to(C[1], { opacity: 1, borderColor: 'rgba(255,194,75,.6)', duration: .6 }, t2)
    .to(dots, { fill: '#FFC24B', duration: .2, stagger: .18 }, t2 + .5)
    .from([flame, flame2], { scale: 0, transformOrigin: '50% 100%', duration: .6, ease: 'back.out(2)' }, t2 + .3);
  tl.to(star, { rotation: 154, svgOrigin: `${cx} ${cy}`, duration: sc.dur, ease: 'none' }, 0)
    .fromTo([flame, flame2], { scaleY: 1 }, { scaleY: 1.15, svgOrigin: `${cx} ${cy + 36}`, duration: .35, yoyo: true, repeat: 20, ease: 'sine.inOut', immediateRender: false }, t2 + .9);
  return tl;
};

BUILD.documents = (sec, cue) => {
  const tl = gsap.timeline();
  const A = h('div', {}); sec.appendChild(A);
  const st = h('div', { class: 'stmt' }, `<p></p><div class="s">Tarihi, ancak elimizdeki yazılı kaynaklar üzerinden anlatabiliriz.</div>`); A.appendChild(st);
  const txt = 'Varsayımların ötesine geçmek için yazılı belgelere başvurmalıyız.';
  $('p', st).innerHTML = txt.split(' ').map(w => `<span class="w">${/yazılı|belgelere/.test(w) ? `<em>${w}</em>` : w}</span>`).join(' ');
  tl.from($$('.w', st), { opacity: 0, y: 30, filter: 'blur(8px)', duration: .6, stagger: .12, ease: 'power3.out' }, .4)
    .from($('.s', st), { opacity: 0, y: 20, duration: .7 }, cue('Tarihi', -.2));
  const docs = h('div', { class: 'docs' }); A.appendChild(docs);
  const svg = s('svg', { viewBox: '0 0 1920 440' }, docs);
  const defs = s('defs', {}, svg);
  const pg = s('linearGradient', { id: 'pap', x1: 0, y1: 0, x2: 1, y2: 1 }, defs);
  s('stop', { offset: 0, 'stop-color': '#EFD9A6' }, pg); s('stop', { offset: 1, 'stop-color': '#D6B676' }, pg);
  // papirüs
  const px = 620, py = 190;
  const sheet = s('g', {}, svg);
  s('rect', { x: px - 260, y: py - 150, width: 520, height: 300, fill: 'url(#pap)' }, sheet);
  for (let i = 0; i < 12; i++) s('line', { x1: px - 260, y1: py - 140 + i * 25, x2: px + 260, y2: py - 140 + i * 25, stroke: 'rgba(120,80,30,.12)', 'stroke-width': 2 }, sheet);
  const glyphs = []; const R = rng(4);
  for (let r = 0; r < 4; r++) for (let c = 0; c < 9; c++) {
    const gx = px - 210 + c * 52, gy = py - 95 + r * 62, k = R();
    const d = k < .45 ? `M${gx} ${gy - 18} V${gy + 18}` : k < .75 ? `M${gx - 14} ${gy + 18} V${gy} A14 14 0 0 1 ${gx + 14} ${gy} V${gy + 18}` : `M${gx} ${gy} m-12 0 a12 12 0 1 0 24 0 a8 8 0 1 0 -16 0`;
    glyphs.push(s('path', { d, stroke: '#5A3A1E', 'stroke-width': 4.5, fill: 'none', 'stroke-linecap': 'round' }, sheet));
  }
  const rollL = s('rect', { x: px - 285, y: py - 165, width: 40, height: 330, rx: 20, fill: '#B8915A' }, svg);
  const rollR = s('rect', { x: px + 245, y: py - 165, width: 40, height: 330, rx: 20, fill: '#B8915A' }, svg);
  // kil tablet
  const tx = 1300, ty = 190;
  const tab = s('g', {}, svg);
  s('rect', { x: tx - 190, y: ty - 160, width: 380, height: 320, rx: 40, fill: '#B5835A', stroke: '#8E6040', 'stroke-width': 4 }, tab);
  s('rect', { x: tx - 172, y: ty - 142, width: 344, height: 284, rx: 30, fill: 'none', stroke: 'rgba(255,255,255,.12)', 'stroke-width': 3 }, tab);
  const wedges = [];
  for (let r = 0; r < 5; r++) for (let c = 0; c < 7; c++) {
    if (R() < .25) continue;
    const wx = tx - 140 + c * 46, wy = ty - 110 + r * 52;
    const g = s('g', {}, tab);
    if (R() < .6) { s('path', { d: `M${wx - 9} ${wy - 14} H${wx + 9} L${wx} ${wy - 2} Z`, fill: '#6E4528' }, g); s('line', { x1: wx, y1: wy - 4, x2: wx, y2: wy + 18, stroke: '#6E4528', 'stroke-width': 4 }, g); }
    else { s('path', { d: `M${wx - 14} ${wy - 9} V${wy + 9} L${wx - 2} ${wy} Z`, fill: '#6E4528' }, g); s('line', { x1: wx - 4, y1: wy, x2: wx + 16, y2: wy, stroke: '#6E4528', 'stroke-width': 4 }, g); }
    wedges.push(g);
  }
  const l1 = h('div', { class: 'dlab' }, '<b>Mısır</b> · papirüs'), l2 = h('div', { class: 'dlab' }, '<b>Mezopotamya</b> · kil tablet');
  l1.style.left = (px - 260) + 'px'; l2.style.left = (tx - 260) + 'px'; docs.append(l1, l2);
  const tD = cue('Bu yüzden ilk yazılı', -.3);
  tl.to(st, { y: -60, scale: .82, transformOrigin: '50% 0%', duration: .9, ease: 'power3.inOut' }, tD - .3)
    .from(sheet, { scaleX: 0, transformOrigin: '50% 50%', duration: 1.4, ease: 'power3.inOut' }, tD)
    .fromTo(rollL, { x: 265 }, { x: 0, duration: 1.4, ease: 'power3.inOut' }, tD)
    .fromTo(rollR, { x: -265 }, { x: 0, duration: 1.4, ease: 'power3.inOut' }, tD)
    .from([rollL, rollR], { opacity: 0, duration: .3 }, tD)
    .from(tab, { opacity: 0, y: 60, rotation: -4, transformOrigin: '50% 50%', duration: 1, ease: 'power3.out' }, tD + .6);
  glyphs.forEach(draw);
  tl.to(glyphs, { strokeDashoffset: 0, duration: .25, stagger: .05 }, tD + 1.3)
    .from(wedges, { scale: 0, transformOrigin: '50% 50%', duration: .25, stagger: .05 }, tD + 1.5)
    .from([l1, l2], { opacity: 0, y: 14, duration: .6, stagger: .3 }, tD + 1.6);
  // kapanış
  const tO = cue('Bir sonraki bölümde', -.4);
  tl.to(A, { opacity: 0, y: -30, duration: .7, ease: 'power2.in' }, tO);
  const O = h('div', { class: 'outro' }, `<div class="eyebrow">Sıradaki bölüm</div><div class="big">Mısır Matematiği</div><svg viewBox="0 0 900 220"></svg><div class="bye">Görüşmek üzere!</div>`);
  sec.appendChild(O);
  const os = $('svg', O);
  const ep = [
    s('path', { d: 'M150 40 V150' }, os),
    s('path', { d: 'M410 150 V80 A40 40 0 0 1 490 80 V150' }, os),
    s('path', { d: 'M750 95 m-40 0 a40 40 0 1 0 80 0 a30 30 0 1 0 -60 0 a20 20 0 1 0 40 0 a10 10 0 1 0 -20 0' }, os)];
  ep.forEach(p => { p.setAttribute('stroke', '#FFC24B'); p.setAttribute('stroke-width', 10); p.setAttribute('fill', 'none'); p.setAttribute('stroke-linecap', 'round'); draw(p); });
  ['1', '10', '100'].forEach((t, i) => { const e = s('text', { x: [150, 450, 750][i], y: 205, 'text-anchor': 'middle', fill: '#8F96B2', style: 'font:650 26px Inter Variable;letter-spacing:.1em' }, os); e.textContent = t; ep.push(e); });
  tl.from($('.eyebrow', O), { opacity: 0, y: 20, duration: .6 }, tO + .6)
    .from($('.big', O), { opacity: 0, y: 50, duration: 1, ease: 'power3.out' }, tO + .8)
    .to(ep.slice(0, 3), { strokeDashoffset: 0, duration: .9, stagger: .35, ease: 'power2.inOut' }, tO + 1.4)
    .from(ep.slice(3), { opacity: 0, duration: .4, stagger: .35 }, tO + 1.8)
    .from($('.bye', O), { opacity: 0, y: 30, duration: .8, ease: 'power3.out' }, cue('Görüşmek üzere', -.2));
  return tl;
};

/* ---------- ana zaman çizelgesi ---------- */
const master = gsap.timeline({ paused: true });
const root = $('#scenes');
SC.forEach((sc, i) => {
  const sec = h('section', { class: 'scene', id: 's-' + sc.id }); root.appendChild(sec);
  const cue = mkCue(sc);
  const tl = BUILD[sc.id](sec, cue, sc);
  master.add(tl, sc.start);
  master.fromTo(sec, { autoAlpha: 0, scale: 1.02 }, { autoAlpha: 1, scale: 1, duration: .7, ease: 'power2.out', immediateRender: i === 0 }, sc.start);
  master.to(sec, { autoAlpha: 0, scale: .985, duration: .6, ease: 'power2.in' }, sc.start + sc.dur - .6);
});
master.fromTo('#progress', { scaleX: 0 }, { scaleX: 1, duration: TOTAL, ease: 'none' }, 0);
master.fromTo('#blob1', { x: 0, y: 0 }, { x: 900, y: 500, duration: TOTAL, ease: 'sine.inOut' }, 0);
master.fromTo('#blob2', { x: 0, y: 0 }, { x: -800, y: -300, duration: TOTAL, ease: 'sine.inOut' }, 0);
master.set({}, {}, TOTAL);

// gren dokusu
(() => { const c = document.createElement('canvas'); c.width = c.height = 256; const x = c.getContext('2d'); const R = rng(1); const d = x.createImageData(256, 256);
  for (let i = 0; i < d.data.length; i += 4) { const v = R() * 255; d.data[i] = d.data[i + 1] = d.data[i + 2] = v; d.data[i + 3] = 255; }
  x.putImageData(d, 0, 0); $('#grain').style.backgroundImage = `url(${c.toDataURL()})`; })();

const sceneNo = $('#sceneNo');
HOOKS.push(() => {
  const t = master.time(); let i = SC.findIndex(s => t < s.start + s.dur); if (i < 0) i = SC.length - 1;
  sceneNo.innerHTML = `<b>${String(i + 1).padStart(2, '0')}</b> / ${SC.length} &nbsp;·&nbsp; ${SC[i].title}`;
});
function onFrame() { HOOKS.forEach(f => f()); }
window.renderFrame = t => { master.seek(t, false); onFrame(); };
window.TOTAL = TOTAL; window.MISSING = MISSING;
if (MISSING.length) console.error('Eksik ipuçları:', MISSING);

/* ---------- önizleme ---------- */
const stage = $('#stage');
function fit() { if (RENDER) return; const W = innerWidth, H = innerHeight - 64; stage.style.transform = `scale(${Math.min(W / 1920, H / 1080)})`; }
addEventListener('resize', fit); fit();
const scrub = $('#scrub'), tm = $('#tm'), btn = $('#play');
scrub.max = TOTAL;
const mmss = t => `${Math.floor(t / 60)}:${String(Math.floor(t % 60)).padStart(2, '0')}`;
gsap.ticker.add(() => { if (master.isActive() || !master.paused()) { onFrame(); scrub.value = master.time(); } tm.textContent = `${mmss(master.time())} / ${mmss(TOTAL)}`; });
btn.onclick = () => { if (master.paused()) { if (master.time() >= TOTAL) master.seek(0); master.play(); btn.textContent = 'Duraklat'; } else { master.pause(); btn.textContent = 'Oynat'; } };
scrub.oninput = () => { master.pause(); btn.textContent = 'Oynat'; window.renderFrame(+scrub.value); };
addEventListener('keydown', e => { if (e.code === 'Space') { e.preventDefault(); btn.onclick(); } });
document.fonts.ready.then(() => { window.renderFrame(0); window.READY = true; });
</script>
