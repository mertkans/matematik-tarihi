<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Matematik Tarihi · Mısır Dönemi</title>
<link rel="stylesheet" href="../../animasyon/vendor/inter/index.css">
<link rel="stylesheet" href="../../animasyon/vendor/fraunces/index.css">
<link rel="stylesheet" href="../../animasyon/vendor/fraunces/wght-italic.css">
<style>
:root{
  --bg:#0D1020; --bg2:#151A30; --ink:#F4EEE3; --mute:#8F96B2; --dim:#555C7A;
  --acc:#FF6B3D; --gold:#FFC24B; --teal:#38D6C4; --sky:#6FA8FF; --rose:#FF5C8A;
  --card:rgba(255,255,255,.045); --line:rgba(255,255,255,.12);
  --serif:'Fraunces Variable',Georgia,serif; --sans:'Inter Variable',system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:#05060c;height:100%;overflow:hidden;color:var(--ink);font-family:var(--sans)}
#wrap{position:absolute;inset:0 0 64px 0;display:flex;align-items:center;justify-content:center}
#stage{position:relative;width:1920px;height:1080px;overflow:hidden;background:var(--bg);flex:none;transform-origin:center center}
body.render #wrap{inset:0;display:block}
body.render #stage{transform:none!important}
body.render #ctrl{display:none}

/* arka plan */
#bg{position:absolute;inset:0;overflow:hidden}
.blob{position:absolute;width:1400px;height:1400px;border-radius:50%}
#blob1{left:-500px;top:-600px;background:radial-gradient(closest-side,rgba(255,194,75,.15),rgba(255,194,75,0))}
#blob2{right:-600px;bottom:-700px;background:radial-gradient(closest-side,rgba(56,120,255,.16),rgba(56,120,255,0))}
#grain{position:absolute;inset:0;opacity:.07;mix-blend-mode:overlay;background-size:256px 256px}

/* sabit çerçeve */
#brand{position:absolute;left:120px;top:52px;font:600 17px var(--sans);letter-spacing:.32em;text-transform:uppercase;color:var(--mute);z-index:20}
#brand b{color:var(--acc);font-weight:700}
#sceneNo{position:absolute;right:120px;top:52px;font:500 17px var(--sans);letter-spacing:.14em;color:var(--mute);z-index:20;text-align:right}
#sceneNo b{color:var(--ink);font-weight:700}
#progress{position:absolute;left:0;bottom:0;height:5px;width:100%;background:linear-gradient(90deg,var(--acc),var(--gold));transform-origin:0 50%;z-index:20}

.scene{position:absolute;inset:0;opacity:0;visibility:hidden}
.full{position:absolute;inset:0;width:1920px;height:1080px}
.abs{position:absolute}
.head{position:absolute;left:120px;top:118px;z-index:5}
.eyebrow{font:650 21px var(--sans);letter-spacing:.3em;text-transform:uppercase;color:var(--acc)}
.h1{font:500 74px/1.05 var(--serif);margin-top:14px;letter-spacing:-.01em}
.card{background:var(--card);border:1px solid var(--line);border-radius:28px}
.pill{display:inline-flex;align-items:center;gap:12px;padding:14px 28px;border-radius:999px;border:1px solid var(--line);background:var(--card);font:600 30px var(--sans)}
.ctitle{font:700 20px var(--sans);letter-spacing:.26em;text-transform:uppercase;color:var(--acc)}
.cbig{font:600 46px/1.1 var(--serif);margin-top:8px}
.csub{font:500 24px/1.4 var(--sans);color:#C9CDE0;margin-top:10px}
.tag{display:inline-block;padding:8px 18px;border-radius:999px;font:700 19px var(--sans);letter-spacing:.08em;text-transform:uppercase}
.tag.r{background:rgba(255,92,138,.14);color:var(--rose);border:1px solid rgba(255,92,138,.5)}
.tag.t{background:rgba(56,214,196,.12);color:var(--teal);border:1px solid rgba(56,214,196,.45)}
.tag.g{background:rgba(255,194,75,.12);color:var(--gold);border:1px solid rgba(255,194,75,.5)}
.cap{position:absolute;left:0;right:0;text-align:center;font:italic 400 40px var(--serif)}
.cap b{color:var(--gold);font-weight:600}

/* kesir */
.fr{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;line-height:1;margin:0 .06em}
.fr>span:first-child{border-bottom:.055em solid currentColor;padding:0 .14em .06em}
.fr>span:last-child{padding-top:.06em}

/* 1 giriş */
.floaters span{position:absolute;font-family:var(--serif);color:var(--ink);line-height:1;white-space:nowrap}
.intro{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.mega{font:600 180px/1 var(--serif);letter-spacing:-.025em;perspective:800px}
.mega .ch{display:inline-block}
.intro-sub{font:italic 300 84px/1 var(--serif);color:var(--acc);margin-top:14px}
.rule{width:220px;height:3px;background:var(--acc);margin:42px 0 46px}
.chips{display:flex;gap:24px}
.chip{padding:18px 32px;border:1px solid var(--line);border-radius:999px;background:rgba(13,16,32,.7);font:500 29px var(--sans)}
.chip b{color:var(--acc);margin-right:14px;font-weight:750}

/* 2 çağlar */
.seg-lab{position:absolute;width:280px;text-align:center}
.seg-lab .t{font:650 27px var(--sans)}
.seg-lab .s{font:500 19px var(--sans);color:var(--mute);margin-top:4px}
.seg-date{position:absolute;width:280px;text-align:center;font:600 20px var(--sans);color:var(--mute);font-variant-numeric:tabular-nums}
.life{position:absolute;left:120px;top:610px;width:1060px;height:370px;padding:30px 40px}
.life .row{display:flex;justify-content:space-between;margin-top:18px}
.life .it{width:300px;text-align:center;position:relative}
.life svg{width:220px;height:170px}
.life .n{font:600 30px var(--serif);margin-top:6px}
.life .x{position:absolute;left:30px;right:30px;top:80px;height:6px;background:var(--rose);border-radius:3px;transform-origin:0 50%;transform:rotate(-18deg)}
.need{position:absolute;left:1240px;top:610px;width:560px;height:370px;padding:30px 40px}
.need svg{width:480px;height:290px;margin-top:4px}

/* 3 harita */
.m-sphere{fill:#10152B}
.m-land{fill:#232A4D;stroke:#3A4372;stroke-width:1;vector-effect:non-scaling-stroke}
.m-egy{fill:rgba(255,194,75,.16);stroke:rgba(255,194,75,.5);stroke-width:1.5;vector-effect:non-scaling-stroke}
.m-irq{fill:rgba(56,214,196,.12);stroke:rgba(56,214,196,.45);stroke-width:1.5;vector-effect:non-scaling-stroke}
.m-river{fill:none;stroke:#6FA8FF;stroke-linecap:round;stroke-linejoin:round}
.m-mark{position:absolute;left:0;top:0;width:0;height:0}
.m-in{position:absolute;left:0;top:0}
.m-dot{position:absolute;left:-10px;top:-10px;width:20px;height:20px;border-radius:50%;background:var(--c);box-shadow:0 0 0 6px rgba(255,255,255,.12),0 0 30px var(--c)}
.m-ring{position:absolute;left:-10px;top:-10px;width:20px;height:20px;border-radius:50%;border:3px solid var(--c)}
.m-lab{position:absolute;left:26px;top:-30px;white-space:nowrap;padding:9px 18px;border-radius:14px;background:rgba(13,16,32,.85);border:1px solid var(--line);border-left:4px solid var(--c)}
.m-lab.l{left:auto;right:26px;border-left:1px solid var(--line);border-right:4px solid var(--c)}
.m-lab .t{font:650 28px var(--sans)}
.m-lab .s{font:500 18px var(--sans);color:var(--mute);margin-top:2px}
.m-region{position:absolute;left:0;top:0;font:600 22px var(--sans);letter-spacing:.32em;text-transform:uppercase;color:rgba(244,238,227,.45);white-space:nowrap;transform-origin:0 0}
.m-region.big{font:600 46px var(--serif);letter-spacing:.3em;color:rgba(255,194,75,.5)}
.m-region.sea{font:italic 400 30px var(--serif);letter-spacing:.12em;text-transform:none;color:rgba(111,168,255,.75)}
.m-region.riv{font:650 22px var(--sans);letter-spacing:.14em;color:#9BC2FF}
.map-shade{position:absolute;left:0;top:0;width:1920px;height:330px;background:linear-gradient(180deg,rgba(13,16,32,.95),rgba(13,16,32,0))}

/* 4 dönemler */
.pl{position:absolute;text-align:center;white-space:nowrap}
.pl .t{font:650 24px var(--sans)}
.pl .s{font:500 18px var(--sans);color:var(--mute);margin-top:3px;font-variant-numeric:tabular-nums}
.pl.ara .t{font:600 19px var(--sans);color:#B9BED6}
.tick{position:absolute;font:600 17px var(--sans);color:var(--dim);transform:translateX(-50%);letter-spacing:.04em}
.callout{position:absolute;left:560px;top:745px;width:860px;height:230px;padding:28px 40px;border-color:rgba(255,107,61,.5)}

/* 5 ilişki */
.illus{position:absolute;left:120px;top:290px;width:1100px;height:640px;border-radius:28px;overflow:hidden;box-shadow:0 30px 80px rgba(0,0,0,.4)}
.illus svg{width:1100px;height:640px;display:block}
.tri{position:absolute;left:1260px;top:290px;width:540px;height:640px}
.tri svg{width:540px;height:640px}

/* 6 papirüs */
.flag{position:absolute;padding:12px 24px;border-radius:999px;font:600 26px var(--sans);background:rgba(13,16,32,.8);border:1px solid var(--line)}
.plab{position:absolute;text-align:center;font:650 22px var(--sans);letter-spacing:.16em;text-transform:uppercase;color:var(--mute)}
.plab b{display:block;font:600 40px var(--serif);letter-spacing:0;text-transform:none;color:var(--ink);margin-bottom:6px}

/* 7 rhind */
.stop{position:absolute;width:300px;text-align:center}
.stop .y{font:600 44px var(--serif);font-variant-numeric:tabular-nums}
.stop .d{font:500 21px/1.3 var(--sans);color:var(--mute);margin-top:8px}
.fcard{position:absolute;top:800px;height:180px;padding:26px 36px}
.chiprow{display:flex;gap:14px;margin-top:16px}
.chiprow span{padding:10px 20px;border-radius:999px;background:rgba(255,194,75,.12);border:1px solid rgba(255,194,75,.45);color:var(--gold);font:600 24px var(--sans)}

/* 8 moskova */
.utab{position:absolute;left:120px;top:290px;width:1120px;height:690px;padding:30px 36px}
.utab .grid{display:grid;grid-template-columns:auto auto auto;justify-content:start;gap:10px 14px;margin-top:20px}
.utab .e{font:500 21px var(--sans);font-variant-numeric:tabular-nums;padding:11px 12px;border-radius:12px;background:rgba(255,255,255,.035);white-space:nowrap}
.utab .e .two{color:var(--acc);font-weight:700}
.utab .e .u{color:var(--ink)}
.uexp{position:absolute;left:1270px;top:290px;width:530px;height:690px;padding:40px}
.uexp .big{font:600 92px/1 var(--serif);margin-top:40px;text-align:center}
.uexp .arrow{font:500 60px var(--sans);color:var(--acc);text-align:center;margin:20px 0}
.stat{position:absolute;top:720px;height:250px;padding:28px 36px}
.bar{height:34px;border-radius:8px;transform-origin:0 50%}

/* 9 sayılar */
.gcard{position:absolute;top:290px;width:226px;height:390px;text-align:center;padding:22px 10px}
.gcard .v{font:700 30px var(--sans);font-variant-numeric:tabular-nums}
.gcard svg{width:150px;height:190px;margin-top:14px}
.gcard .n{font:500 20px/1.3 var(--sans);color:var(--mute);margin-top:12px}
.ex{position:absolute;left:120px;right:120px;top:720px;height:260px}
.ex .q{position:absolute;left:0;top:0;font:700 20px var(--sans);letter-spacing:.26em;text-transform:uppercase;color:var(--acc)}

/* 10 işlemler */
.ops{position:absolute;left:120px;right:120px;top:290px;display:flex;gap:20px}
.ops .pill b{color:var(--gold);font:700 34px var(--serif)}
.ocard{position:absolute;top:400px;height:570px;padding:30px 36px}
.eq{font:600 44px/1 var(--serif);font-variant-numeric:tabular-nums;white-space:nowrap;position:relative;display:table}
.eq i{font-style:normal;color:var(--acc)}
.dt{width:100%;margin-top:18px;border-collapse:collapse}
.dt td{font:600 40px var(--serif);font-variant-numeric:tabular-nums;padding:6px 18px;border-bottom:1px solid var(--line);position:relative}
.dt td:first-child{width:120px;color:var(--mute)}
.dt td .ck{position:absolute;left:-26px;top:12px;color:var(--teal);font:700 30px var(--sans)}
.banner{position:absolute;left:0;right:0;top:282px;text-align:center;font:600 50px var(--serif)}
.banner b{color:var(--gold)}

/* 11 kesirler */
.mini{position:absolute;left:120px;top:290px;padding:18px 26px;width:760px}
.mini .r{font:500 25px var(--sans);font-variant-numeric:tabular-nums;padding:8px 12px;border-radius:10px;white-space:nowrap}
.mini .r.hl{background:rgba(255,107,61,.16);color:var(--ink);box-shadow:inset 4px 0 0 var(--acc)}
.mini .lb{font:700 18px var(--sans);letter-spacing:.24em;text-transform:uppercase;color:var(--mute);margin-bottom:6px}
.bigeq{position:absolute;left:0;right:0;top:470px;display:flex;justify-content:center;align-items:center;font:600 92px var(--serif);font-variant-numeric:tabular-nums}
.bigeq .op{display:inline-block;overflow:hidden;text-align:center;color:var(--acc);width:100px}
.bigeq .lhs{color:var(--gold)}
.bm{position:absolute;left:0;top:0}
.bm-lab{position:absolute;font:600 24px var(--sans);text-align:center;font-variant-numeric:tabular-nums}

/* 12 geometri */
.gq{position:absolute;width:820px;height:335px;padding:26px 34px;overflow:hidden}
.gq svg{position:absolute;left:20px;top:20px;width:400px;height:295px}
.gq .tx{position:absolute;left:430px;top:30px;right:30px}
.gq .tt{font:600 40px/1.1 var(--serif)}
.gq .ff{font:600 36px var(--serif);margin-top:20px;white-space:nowrap}
.gq .ss{font:500 22px/1.4 var(--sans);color:#C9CDE0;margin-top:14px}

/* 13 denklemler */
.dcard{position:absolute;top:290px;width:820px;height:690px;padding:34px 40px}
.dcard .src{font:700 19px var(--sans);letter-spacing:.22em;text-transform:uppercase;color:var(--mute)}
.dcard .pr{font:italic 400 38px/1.3 var(--serif);margin-top:18px}
.dcard .st{font:600 40px var(--serif);margin-top:16px;white-space:nowrap}
.strk{position:absolute;left:-10px;right:-10px;top:52%;height:5px;background:var(--rose);border-radius:3px;transform-origin:0 50%}

/* 14 zayıflık */
.recipe{position:absolute;left:120px;top:290px;width:860px;height:600px}
.recipe svg{position:absolute;inset:0;width:860px;height:600px}
.recipe .ln{position:absolute;left:110px;font:italic 500 38px var(--serif);color:#4A2E16;white-space:nowrap}
.scale{position:absolute;left:1040px;top:290px;width:760px;height:600px}
.scale svg{width:760px;height:600px}

/* 15 kapanış */
.cmp{position:absolute;top:340px;width:800px;height:600px;padding:36px 44px}
.cmp .nm{font:600 64px var(--serif)}
.cmp .sb{font:600 22px var(--sans);letter-spacing:.2em;text-transform:uppercase;color:var(--mute);margin-top:6px}
.cmp .rw{margin-top:34px}
.cmp .rl{font:700 18px var(--sans);letter-spacing:.24em;text-transform:uppercase;color:var(--mute);margin-bottom:12px}
.cmp .li{font:500 27px var(--sans);margin-top:10px;color:#DADDEB}
.cmp .li b{color:var(--gold);font-weight:650}
.same{position:absolute;left:120px;width:1680px;top:288px;height:30px}
.outro{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.outro .big{font:600 140px/1 var(--serif);margin-top:18px;letter-spacing:-.02em}
.outro svg{width:900px;height:220px;margin-top:40px}
.outro .bye{font:italic 400 64px var(--serif);color:var(--acc);margin-top:30px}

/* önizleme kontrolleri */
#ctrl{position:fixed;left:0;right:0;bottom:0;height:64px;display:flex;align-items:center;gap:16px;padding:0 20px;background:#0b0d18;border-top:1px solid #222;font:500 14px var(--sans);color:#aab}
#ctrl button{background:#FF6B3D;color:#111;border:0;border-radius:8px;padding:8px 16px;font:700 14px var(--sans);cursor:pointer;min-width:84px}
#ctrl input{flex:1;accent-color:#FF6B3D}
#ctrl #tm{font-variant-numeric:tabular-nums;min-width:120px;text-align:right}
</style>
</head>
<body>
<div id="wrap"><div id="stage">
  <div id="bg"><div class="blob" id="blob1"></div><div class="blob" id="blob2"></div><div id="grain"></div></div>
  <div id="brand">Matematik Tarihi <b>·</b> Mısır Dönemi</div>
  <div id="sceneNo"></div>
  <div id="scenes"></div>
  <div id="progress"></div>
  <svg width="0" height="0" style="position:absolute">
    <defs>
      <linearGradient id="pap" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#EFD9A6"/><stop offset="1" stop-color="#D6B676"/></linearGradient>
      <linearGradient id="water" x1="0" x2="1"><stop offset="0" stop-color="#3B6FD8" stop-opacity=".85"/><stop offset="1" stop-color="#6FA8FF" stop-opacity=".7"/></linearGradient>
      <radialGradient id="starGlow"><stop offset="0" stop-color="#FFF6D8" stop-opacity=".9"/><stop offset="1" stop-color="#FFC24B" stop-opacity="0"/></radialGradient>
      <symbol id="sheep" viewBox="0 0 120 96">
        <rect x="34" y="62" width="7" height="24" rx="3" fill="#2A2F45"/><rect x="48" y="64" width="7" height="22" rx="3" fill="#2A2F45"/>
        <rect x="66" y="64" width="7" height="22" rx="3" fill="#2A2F45"/><rect x="78" y="62" width="7" height="24" rx="3" fill="#2A2F45"/>
        <g fill="#F4EEE3"><circle cx="34" cy="46" r="17"/><circle cx="52" cy="36" r="19"/><circle cx="72" cy="38" r="18"/><circle cx="84" cy="52" r="15"/><circle cx="44" cy="60" r="15"/><circle cx="66" cy="60" r="16"/><circle cx="24" cy="56" r="12"/></g>
        <ellipse cx="98" cy="40" rx="13" ry="16" fill="#2A2F45"/><ellipse cx="90" cy="30" rx="8" ry="4" transform="rotate(-25 90 30)" fill="#2A2F45"/>
        <circle cx="102" cy="37" r="2.6" fill="#F4EEE3"/>
      </symbol>
    </defs>
  </svg>
</div></div>
<div id="ctrl"><button id="play">Oynat</button><input id="scrub" type="range" min="0" step="0.01" value="0"><span id="tm"></span></div>

<script src="../../animasyon/vendor/gsap.min.js"></script>
<script src="../../animasyon/vendor/d3-array.min.js"></script>

<script src="../../animasyon/vendor/world.js"></script>

<script>
'use strict';
const RENDER = new URLSearchParams(location.search).has('render');
if (RENDER) document.body.classList.add('render');

const LEAD = 1.0, TAIL = 1.0;
const SC = window.SCENES;
let T = 0; SC.forEach(s => { s.start = T; T += s.dur; });
const TOTAL = T;
const HOOKS = [], MISSING = [];

/* ---------- yardımcılar ---------- */
const $ = (q, r = document) => r.querySelector(q), $$ = (q, r = document) => [...r.querySelectorAll(q)];
const NS = 'http://www.w3.org/2000/svg';
function h(tag, attrs = {}, html) { const e = document.createElement(tag); for (const k in attrs) e.setAttribute(k, attrs[k]); if (html != null) e.innerHTML = html; return e; }
function s(tag, attrs = {}, parent) { const e = document.createElementNS(NS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); if (parent) parent.appendChild(e); return e; }
function rng(seed) { return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function head(sec, eyebrow, title) { const d = h('div', { class: 'head' }, `<div class="eyebrow">${eyebrow}</div><div class="h1">${title}</div>`); sec.appendChild(d); return d; }
function headIn(tl, d, at = 0.25) {
  tl.from(d.children[0], { y: 20, opacity: 0, duration: .6, ease: 'power3.out' }, at)
    .from(d.children[1], { y: 40, opacity: 0, duration: .8, ease: 'power3.out' }, at + .12);
}
function draw(el) { const L = el.getTotalLength(); el.style.strokeDasharray = L + ' ' + L; el.style.strokeDashoffset = L; return L; }
function useEl(parent, id, x, y, w, hgt) { return s('use', { href: '#' + id, x, y, width: w, height: hgt }, parent); }
function box(sec, cls, x, y, w, hgt, html = '') { const d = h('div', { class: cls }, html); Object.assign(d.style, { left: x + 'px', top: y + 'px', width: w + 'px', height: hgt + 'px' }); sec.appendChild(d); return d; }
const fr = (n, d) => `<span class="fr"><span>${n}</span><span>${d}</span></span>`;
function splitChars(el) {
  const words = el.textContent.split(' ');
  el.innerHTML = words.map(w => `<span style="display:inline-block;white-space:nowrap">${[...w].map(c => `<span class="ch">${c}</span>`).join('')}</span>`).join(' ');
  return $$('.ch', el);
}
function txt(parent, x, y, str, style, attrs = {}) { const t = s('text', { x, y, style, ...attrs }, parent); t.textContent = str; return t; }
/* Papirüs rulosu (SVG): yaprak + iki silindir + yazı izleri */
function scrollSVG(parent, x, y, w, hgt, seed = 3, opts = {}) {
  const g = s('g', {}, parent);
  const sheet = s('g', {}, g);
  s('rect', { x, y, width: w, height: hgt, fill: 'url(#pap)' }, sheet);
  const R = rng(seed);
  const nl = Math.max(2, Math.floor(hgt / 22));

function glyph(parent, type, x = 0, y = 0, k = 1, col = '#FFC24B', sw = 7) {

  if (type === 100) out.push(P('M60 140 V96 M60 96 m-30 0 a30 30 0 1 0 60 0 a22 22 0 1 0 -44 0 a14 14 0 1 0 28 0 a6 6 0 1 0 -12 0'), P('M60 140 C 60 60 70 40 92 28'));

  if (type === 100000) out.push(P('M60 72 m-24 0 a24 30 0 1 0 48 0 a24 30 0 1 0 -48 0'), P('M60 102 C42 118 78 128 60 146'), P('M52 64 h2 M68 64 h2'));

/* Anlatım metnindeki bir ifadenin sahne içindeki zamanı (sn). Noktalama duraklamaları ağırlıklandırılır. */
function mkCue(sc) {
  const t = sc.text, w = [0]; let acc = 0;
  for (let i = 0; i < t.length; i++) { const c = t[i]; acc += 1 + ('.!?'.includes(c) ? 9 : (',;:'.includes(c) ? 4 : 0)); w.push(acc); }
  const speech = sc.speech ?? (sc.dur - LEAD - TAIL);
  const at = i => LEAD + w[Math.max(0, Math.min(i, t.length))] / acc * speech;
  const cue = (phrase, off = 0, nth = 1) => {
    let i = -1; for (let k = 0; k < nth; k++) { i = t.indexOf(phrase, i + 1); if (i < 0) break; }
    if (i < 0) { MISSING.push(sc.id + ': ' + phrase); i = 0; }
    return at(i) + off;
  };
  cue.at = at; cue.idx = (phrase, from = 0) => t.indexOf(phrase, from);
  cue.end = LEAD + speech;
  return cue;
}

  $('.r3', M).innerHTML = '<div class="li m1" style="font:600 34px var(--serif);color:#38D6C4">Daha gelişmiş ✓</div>';
  const t0 = cue('Mezopotamya uygarlığıyla', -.3);
  tl.from(E, { opacity: 0, y: 40, duration: .7 }, t0).from(M, { opacity: 0, y: 40, duration: .7 }, t0 + .3);
  draw(br);
  const tS = cue('aynı dönemde', -.3);
  tl.to(br, { strokeDashoffset: 0, duration: .8 }, tS).from(brT, { opacity: 0, y: 10, duration: .5 }, tS + .3);
  const tG = cue('çok geride', -.4);
  tl.from([$('.fill', E), $('.fill', M)], { width: 0, duration: 1.2, stagger: .2, ease: 'power3.out' }, tG);
  const tC = cue('coğrafi ve sosyal', -.3);
  tl.from([$('.cond span', E), $('.cond span', M)], { opacity: 0, scale: .7, duration: .5, stagger: .4, ease: 'back.out(2)' }, tC)
    .from($('.m1', M), { opacity: 0, x: -14, duration: .5 }, cue('daha gelişmiştir', -.3))
    .from($('.l1', E), { opacity: 0, x: -14, duration: .5 }, cue('yalnızca toplama', -.3))
    .from($('.l2', E), { opacity: 0, x: -14, duration: .5 }, cue('yaklaşık değerlerdi', -.3));
  // kapanış
  const tO = cue('Bir sonraki videoda', -.3);
  tl.to(A, { opacity: 0, y: -30, duration: .7, ease: 'power2.in' }, tO);
  const O = h('div', { class: 'outro' }, `<div class="eyebrow">Sıradaki bölüm</div><div class="big">Mezopotamya Matematiği</div><svg viewBox="0 0 900 220"></svg><div class="bye">Görüşmek üzere!</div>`);
  sec.appendChild(O);
  const os = $('svg', O);
  const vw = (x, y) => { const g = s('g', {}, os); s('path', { d: `M${x - 22} ${y - 30} H${x + 22} L${x} ${y - 6} Z`, fill: '#FFC24B' }, g); s('line', { x1: x, y1: y - 10, x2: x, y2: y + 70, stroke: '#FFC24B', 'stroke-width': 8, 'stroke-linecap': 'round' }, g); return g; };
  const cw = (x, y) => { const g = s('g', {}, os); s('path', { d: `M${x + 40} ${y - 30} L${x - 10} ${y} L${x + 40} ${y + 30}`, stroke: '#FFC24B', 'stroke-width': 8, fill: 'none', 'stroke-linecap': 'round' }, g); s('path', { d: `M${x - 22} ${y} L${x + 2} ${y - 16} L${x + 2} ${y + 16} Z`, fill: '#FFC24B' }, g); return g; };
  const wedges = [vw(150, 70), cw(440, 100), vw(750, 70)];
  const lbs = ['1', '10', '60'].map((t, i) => txt(os, [150, 450, 750][i], 205, t, 'font:650 26px Inter Variable;fill:#8F96B2;letter-spacing:.1em', { 'text-anchor': 'middle' }));
  tl.from($('.eyebrow', O), { opacity: 0, y: 20, duration: .6 }, tO + .6)
    .from($('.big', O), { opacity: 0, y: 50, duration: 1, ease: 'power3.out' }, tO + .8)
    .from(wedges, { opacity: 0, y: -30, scale: .6, transformOrigin: '50% 50%', duration: .6, stagger: .3, ease: 'back.out(2)' }, tO + 1.3)
    .from(lbs, { opacity: 0, duration: .4, stagger: .3 }, tO + 1.6)
    .from($('.bye', O), { opacity: 0, y: 30, duration: .8, ease: 'power3.out' }, cue('görüşmek üzere', -.2));
  return tl;
};

/* ---------- ana zaman çizelgesi ---------- */
const master = gsap.timeline({ paused: true });
const root = $('#scenes');
SC.forEach((sc, i) => {
  const sec = h('section', { class: 'scene', id: 's-' + sc.id }); root.appendChild(sec);
  const cue = mkCue(sc);
  const tl = BUILD[sc.id](sec, cue, sc);
  master.add(tl, sc.start);
  master.fromTo(sec, { autoAlpha: 0, scale: 1.02 }, { autoAlpha: 1, scale: 1, duration: .7, ease: 'power2.out', immediateRender: i === 0 }, sc.start);
  master.to(sec, { autoAlpha: 0, scale: .985, duration: .6, ease: 'power2.in' }, sc.start + sc.dur - .6);
});
master.fromTo('#progress', { scaleX: 0 }, { scaleX: 1, duration: TOTAL, ease: 'none' }, 0);
master.fromTo('#blob1', { x: 0, y: 0 }, { x: 900, y: 500, duration: TOTAL, ease: 'sine.inOut' }, 0);
master.fromTo('#blob2', { x: 0, y: 0 }, { x: -800, y: -300, duration: TOTAL, ease: 'sine.inOut' }, 0);
master.set({}, {}, TOTAL);

// gren dokusu
(() => { const c = document.createElement('canvas'); c.width = c.height = 256; const x = c.getContext('2d'); const R = rng(1); const d = x.createImageData(256, 256);
  for (let i = 0; i < d.data.length; i += 4) { const v = R() * 255; d.data[i] = d.data[i + 1] = d.data[i + 2] = v; d.data[i + 3] = 255; }
  x.putImageData(d, 0, 0); $('#grain').style.backgroundImage = `url(${c.toDataURL()})`; })();

const sceneNo = $('#sceneNo');
HOOKS.push(() => {
  const t = master.time(); let i = SC.findIndex(s => t < s.start + s.dur); if (i < 0) i = SC.length - 1;
  sceneNo.innerHTML = `<b>${String(i + 1).padStart(2, '0')}</b> / ${SC.length} &nbsp;·&nbsp; ${SC[i].title}`;
});
function onFrame() { HOOKS.forEach(f => f()); }
window.renderFrame = t => { master.seek(t, false); onFrame(); };
window.TOTAL = TOTAL; window.MISSING = MISSING;
if (MISSING.length) console.error('Eksik ipuçları:', MISSING);

/* ---------- önizleme ---------- */
const stage = $('#stage');
function fit() { if (RENDER) return; const W = innerWidth, H = innerHeight - 64; stage.style.transform = `scale(${Math.min(W / 1920, H / 1080)})`; }
addEventListener('resize', fit); fit();
const scrub = $('#scrub'), tm = $('#tm'), btn = $('#play');
scrub.max = TOTAL;
const mmss = t => `${Math.floor(t / 60)}:${String(Math.floor(t % 60)).padStart(2, '0')}`;
gsap.ticker.add(() => { if (master.isActive() || !master.paused()) { onFrame(); scrub.value = master.time(); } tm.textContent = `${mmss(master.time())} / ${mmss(TOTAL)}`; });
btn.onclick = () => { if (master.paused()) { if (master.time() >= TOTAL) master.seek(0); master.play(); btn.textContent = 'Duraklat'; } else { master.pause(); btn.textContent = 'Oynat'; } };
scrub.oninput = () => { master.pause(); btn.textContent = 'Oynat'; window.renderFrame(+scrub.value); };
addEventListener('keydown', e => { if (e.code === 'Space') { e.preventDefault(); btn.onclick(); } });
document.fonts.ready.then(() => { window.renderFrame(0); window.READY = true; });
</script>
</body>
